# MiroFish nginx vhost: Frontend dist auf :3000, /api/* -> Backend :5001
# Installiert nach /etc/nginx/sites-available/mirofish (siehe install/mirofish-install.sh)
server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  server_name _;

  root /opt/mirofish/frontend/dist;
  index index.html;

  # SPA fallback (Vue Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Frontend ruft /api auf -> Proxy zum Flask-Backend
  location /api/ {
    proxy_pass http://127.0.0.1:5001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://127.0.0.1:5001/health;
  }
}
